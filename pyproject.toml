[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msand-sdl"
version = "0.1.0"
description = "Self-Driving Laboratory for manufactured-sand concrete mix proportioning"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "pyyaml",
    "openpyxl",
]

# Model and optimiser backends (torch / gpytorch / botorch) are deliberately absent.
# S07, S08 and S11 choose their backend in a later task.

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
include = ["msand_sdl*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# Checked against the declared floor, not whatever interpreter happens to be local.
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
# numpy's shipped stubs use 3.12+ type syntax, which is a parse error under a 3.11 target.
# Skip following them rather than relaxing the target: numpy is an annotation-only import
# in this tree, so treating it as Any costs nothing today. Revisit when S07/S08 land.
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true
ignore_errors = true

[[tool.mypy.overrides]]
# Neither ships type information; both are annotation-only imports in this tree.
module = ["pandas.*", "yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
