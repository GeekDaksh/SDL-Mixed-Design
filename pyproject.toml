[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msand-sdl"
version = "0.1.0"
description = "Self-Driving Laboratory for manufactured-sand concrete mix proportioning"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "pyyaml",
    "openpyxl",
]

# Model and optimiser backends (torch / gpytorch / botorch) are deliberately absent.
# S07, S08 and S11 choose their backend in a later task.

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
include = ["msand_sdl*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# No python_version pin: it is checked against the running interpreter. Pinning to 3.11
# makes mypy reject numpy's own stubs, which use 3.12+ type syntax. The >=3.11 floor is
# declared in [project] and is what CI should matrix over.
strict = true

[[tool.mypy.overrides]]
# Neither ships type information; both are annotation-only imports in this tree.
module = ["pandas.*", "yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
