rules:

  - id: is9103.dosage_cap.unverified
    clause: unlocated
    title: Admixture dosage cap — no verified numeric limit
    tag: NV
    kind: statement
    role: constraint
    manual_ref: "§8.4 and §9 item 4"
    value: >-
      No numeric admixture dosage cap has been verified in IS 9103 : 1999. The previous
      engine enforced a 2.0 percent of binder limit attributed to this standard.
    notes:
      - >-
        IS 456 cl 5.5.1 states conformity only and sets no dosage cap. IS 10262 Annex G
        gives typical doses — plasticisers 0.3 to 0.5 percent, superplasticisers 0.5 to 1.5
        percent — as informative guidance, not as limits.
      - >-
        Until the source is found, the admixture check must report NOT_VERIFIED, not PASS.
        A gate that prints PASS for a check it has not run is the exact failure the gate
        exists to prevent (§8.2, §8.4).
      - >-
        If no numeric cap exists in IS 9103, reclassify this as a project constraint and
        label it so — at which point it becomes bindable. It is not bindable as it stands.
    next_action: >-
      Read standards/is9103_1999.pdf for any dosage limit. If one exists, codify it with its
      clause and re-tag as IS. If none exists, restate the 2.0 percent figure as a PC
      project constraint with the reasoning recorded, or drop it.
