standard: IS 456
year: 2000
title: Plain and Reinforced Concrete — Code of Practice
revision: Fourth Revision
source_file: standards/is456_2000.pdf
library_file: IS_codes/is.456.2000.pdf
source_sha256: null      # written by scripts/00_freeze_standards.py
read_from_primary: true  # docs/Build_Manual_v3.md §0.1

caveats:
  - id: amendment_currency
    tag: NV
    manual_ref: "§0.3"
    text: >-
      The copy in the library is the 2000 base print; its "Amendments Issued Since
      Publication" table is blank. IS 456:2000 has carried amendments. No clause codified
      from it should be treated as amendment-current until checked against a current BIS
      print. One bounded task, not a reason to stop building.

rules:

  # ------------------------------------------------------------------ definitions

  - id: is456.cl_6_1_1.characteristic_strength
    clause: cl 6.1.1
    title: Characteristic strength — the 5 percent fractile
    tag: IS
    kind: scalar
    role: input
    value: 5
    unit: percent
    manual_ref: "§5.4"
    notes:
      - >-
        "The characteristic strength is defined as the strength of material below which not
        more than 5 percent of the test results are expected to fall."
      - >-
        The fractile is defined here, in cl 6.1.1 — not in cl 9.2.2. cl 9.2.2 carries the
        1.65 multiplier, which is the one-sided 5 percent normal quantile. Cite cl 6.1.1 for
        the fractile and cl 9.2.2 for the formula.
      - >-
        This is not an acceptance criterion. Acceptance is the separate sampling procedure
        of IS 456 clause 16, which is not read (§9 item 7). Keep characteristic, target
        mean, predicted mean, individual specimen, batch and acceptance apart.

  # ------------------------------------------------------------------ grade and use

  - id: is456.cl_6_1_2.minimum_grade
    clause: cl 6.1.2
    title: Minimum grade of concrete shall be as per Table 5
    tag: IS
    kind: statement
    role: constraint
    manual_ref: "§1.2 and §5.3"
    value: >-
      The minimum grade of concrete for plain and reinforced concrete shall be as per
      Table 5.
    notes:
      - Read the limit from is456.table_5.durability for the exposure and use class.
      - Subject to cl 6.1.3, which legitimises lower grades for a declared category of work.

  - id: is456.cl_6_1_3.lower_grades_permitted
    clause: cl 6.1.3
    title: Grades below Table 5 permitted for plain, lean, simple and temporary work
    tag: IS
    kind: statement
    role: constraint
    manual_ref: "§1.2"
    value: >-
      "Concrete of grades lower than those given in Table 5 may be used for plain concrete
      constructions, lean concrete, simple foundations, foundation for masonry walls and
      other simple or temporary reinforced concrete construction."
    applies_to: use class LEAN_SIMPLE_TEMPORARY
    notes:
      - >-
        This is why the use field carries three values, not two. Under an RCC + moderate
        default, M10/M15/M20 must fail the minimum-grade check — that is correct behaviour.
        The resolution is this clause, not a weakened check (§8.3).

  - id: is456.cl_9_1_1.nominal_mix_ceiling
    clause: cl 9.1.1
    title: Nominal mix concrete — permitted only up to M20
    tag: IS
    kind: scalar
    role: constraint
    value: 20
    unit: grade
    manual_ref: "§5 check 5 and §8.2"
    notes:
      - A nominal mix above M20 fails. Design mix is required above that grade.
      - >-
        The previous engine encoded this as `not (grade > MAX and False)`, which is always
        True — it printed PASS in every report ever produced, having evaluated nothing
        (§8.2). This check must be able to fail.

  - id: is456.table_9.nominal_mix_proportions
    clause: Table 9 (cl 9.3, 9.2.1)
    title: Proportions for nominal mix concrete
    tag: IS
    kind: table
    role: input
    key: [grade]
    unit: kg per 50 kg cement; water kg per 50 kg cement
    manual_ref: "§1.1"
    value:
      - {grade: M5,   total_aggregate_kg_per_50kg_cement: 800, max_water_kg_per_50kg_cement: 60}
      - {grade: M7.5, total_aggregate_kg_per_50kg_cement: 625, max_water_kg_per_50kg_cement: 45}
      - {grade: M10,  total_aggregate_kg_per_50kg_cement: 480, max_water_kg_per_50kg_cement: 34}
      - {grade: M15,  total_aggregate_kg_per_50kg_cement: 330, max_water_kg_per_50kg_cement: 32}
      - {grade: M20,  total_aggregate_kg_per_50kg_cement: 250, max_water_kg_per_50kg_cement: 30}
    notes:
      - >-
        This is the only place M5 and M7.5 appear. IS 10262 Table 1 (X factor) and Table 2
        (assumed standard deviation) both start at M10, so the engine must not attempt a
        design mix below M10 — doing so means inventing an X and an S the standard does not
        publish (§1.1).
      - "Fine to coarse generally 1:2; upper limit 1:1.5, lower limit 1:2.5."

  # ------------------------------------------------------------------ target mean

  - id: is456.cl_9_2_2.target_mean_strength
    clause: cl 9.2.2
    title: Target mean strength = fck + 1.65 S
    tag: IS
    kind: formula
    role: procedure
    value: "f_target = fck + 1.65 * S"
    unit: N/mm2
    manual_ref: "§2.1 and §5.4"
    conflicts_with:
      - is10262.cl_4_2.target_mean_strength
    notes:
      - >-
        "The mix shall be designed to produce the grade of concrete having the required
        workability and a characteristic strength not less than appropriate values given in
        Table 2. The target mean strength … should be equal to the characteristic strength
        plus 1.65 times the standard deviation."
      - >-
        IS 10262:2019 cl 4.2 states max(fck + 1.65 S, fck + X) — the later, more specific
        mix-proportioning document, and the stricter of the two. The declared resolution is
        is10262.pc.target_mean_resolution. Until that is applied, neither side binds.

  # ------------------------------------------------------------------ cement content

  - id: is456.cl_8_2_4_2.max_cement
    clause: cl 8.2.4.2
    title: Maximum cement content, excluding fly ash and GGBS
    tag: IS
    kind: scalar
    role: constraint
    value: 450
    unit: kg/m3
    applies_to: cement only, not including fly ash or ground granulated blast furnace slag
    override: special_consideration_in_design
    manual_ref: "§5.1"
    notes:
      - >-
        "Cement content not including fly ash and ground granulated blast furnace slag in
        excess of 450 kg/m3 should not be used unless special consideration has been given
        in design to the increased risk of cracking due to drying shrinkage in thin
        sections, or to early thermal cracking and to the increased risk of damage due to
        alkali silica reactions."
      - >-
        It caps cement, not cementitious material. Capping total binder at 450 is wrong.
        IS 10262's worked examples apply it to OPC content only, and Annex D finishes a
        genuine M70 at 428 kg OPC with 20 percent SCM.
      - >-
        The verb is "should not … unless". Encoding it as a hard silent reject is stricter
        than the code. It binds as a constraint with a documented override that records the
        special consideration — which is what the clause contemplates.
      - >-
        Corroborated throughout IS 10262:2019 — Annex A-1(j), D-1(k), D-7, E-1(h), F-1(j),
        and cl 6.2.6 restates the special-consideration condition.

  # ------------------------------------------------------------------ durability

  - id: is456.table_5.durability
    clause: Table 5 (cl 6.1.2, 8.2.4.1, 9.1.2)
    title: Minimum cement, maximum free w/c and minimum grade by exposure and use
    tag: IS
    kind: table
    role: constraint
    key: [exposure, use]
    unit: min_cement kg/m3; max_free_wc ratio; min_grade grade
    applies_to: 20 mm nominal maximum aggregate size, normal weight aggregate
    manual_ref: "§5.3"
    value:
      - {exposure: mild,        use: pcc, min_cement: 220, max_free_wc: 0.60, min_grade: null, corroborated: false}
      - {exposure: moderate,    use: pcc, min_cement: 240, max_free_wc: 0.60, min_grade: M15,  corroborated: true}
      - {exposure: severe,      use: pcc, min_cement: 250, max_free_wc: 0.50, min_grade: M20,  corroborated: false}
      - {exposure: very_severe, use: pcc, min_cement: 260, max_free_wc: 0.45, min_grade: M20,  corroborated: false}
      - {exposure: extreme,     use: pcc, min_cement: 280, max_free_wc: 0.40, min_grade: M25,  corroborated: false}
      - {exposure: mild,        use: rcc, min_cement: 300, max_free_wc: 0.55, min_grade: M20,  corroborated: false}
      - {exposure: moderate,    use: rcc, min_cement: 300, max_free_wc: 0.50, min_grade: M25,  corroborated: false}
      - {exposure: severe,      use: rcc, min_cement: 320, max_free_wc: 0.45, min_grade: M30,  corroborated: true}
      - {exposure: very_severe, use: rcc, min_cement: 340, max_free_wc: 0.45, min_grade: M35,  corroborated: false}
      - {exposure: extreme,     use: rcc, min_cement: 360, max_free_wc: 0.40, min_grade: M40,  corroborated: false}
    caveats:
      - >-
        [NV] Read from an OCR'd scan with visible character damage. Four cells are
        independently corroborated by IS 10262:2019's annexes and carry corroborated: true —
        severe RCC 320 kg/m3 and 0.45 (Annexes A-7, B-5, C-7), and moderate PCC 240 kg/m3
        (Annex F-7). Confirm the whole table visually against a clean print before relying
        on any cell marked corroborated: false. This is a five-minute task and it gates the
        entire durability layer (§5.3, §9 item 2).
    notes:
      - "Note 2 — minimum grade for plain concrete under mild exposure is not specified."
      - >-
        Note 1 — the tabulated minimum cement content "is inclusive of additions mentioned
        in 5.2. The additions such as fly ash or ground granulated blast furnace slag may be
        taken into account … if the suitability is established and as long as the maximum
        amounts taken into account do not exceed the limit of pozzolana and slag specified
        in IS 1489 (Part 1) and IS 455 respectively."
      - >-
        The asymmetry that is easy to get wrong: the maximum (cl 8.2.4.2) EXCLUDES SCM, the
        minimum (this table) INCLUDES it — conditionally. See is456.table_5_note_1.scm_credit.

  - id: is456.table_5_note_1.scm_credit
    clause: Table 5 Note 1
    title: Counting fly ash and GGBS toward the minimum cement content
    tag: NV
    kind: statement
    role: constraint
    manual_ref: "§5.2 and §9 item 5"
    value: >-
      SCM may be counted toward the Table 5 minimum only if suitability is established and
      the amounts do not exceed the pozzolana and slag limits of IS 1489 (Part 1) and
      IS 455 respectively.
    notes:
      - >-
        Those IS 1489 (Part 1) and IS 455 limits are not verified. IS 455 is not in the
        project library at all; IS 1489 (Part 1) is in the library but unread. Until they
        are read, counting full binder toward the minimum is unbacked, and the minimum-binder
        check must carry the caveat rather than silently crediting SCM.
    next_action: >-
      Read the pozzolana limit from IS_codes/is.1489.1.1991.pdf and obtain IS 455, then
      re-tag this rule.

  - id: is456.table_6.msa_adjustment
    clause: Table 6 (cl 8.2.4.1)
    title: Adjustment to the Table 5 minimum cement content for other aggregate sizes
    tag: IS
    kind: table
    role: constraint
    key: [msa_mm]
    unit: kg/m3
    manual_ref: "§5.3"
    value:
      - {msa_mm: 10, min_cement_adjustment: 40}
      - {msa_mm: 20, min_cement_adjustment: 0}
      - {msa_mm: 40, min_cement_adjustment: -30}
    notes:
      - >-
        Corroborated by IS 10262 Annex F-7: moderate PCC 240 kg/m3 with the -30 adjustment
        gives 210 kg/m3.

  # ------------------------------------------------------------------ admixtures

  - id: is456.cl_5_5_1.admixture_conformity
    clause: cl 5.5.1
    title: Admixtures shall comply with IS 9103
    tag: IS
    kind: statement
    role: constraint
    value: "Admixture, if used shall comply with IS 9103."
    manual_ref: "§5 check 8 and §8.4"
    notes:
      - >-
        The clause states conformity only. It sets no dosage cap. The 2.0 percent cap the
        previous engine enforced under this citation has no verified source — see
        is9103.dosage_cap.unverified.

  - id: is456.cl_5_2.mineral_admixtures
    clause: cl 5.2
    title: Mineral admixtures — the additions Table 5 Note 1 refers to
    tag: IS
    kind: statement
    role: input
    value: >-
      Pozzolanic and other mineral additions recognised for use with cement, referred to by
      Table 5 Note 1 when counting additions toward the minimum cement content.
    manual_ref: "§5.2"
