    value:
      - {annex: A, grade: M40, subject: OPC/PPC ordinary}
      - {annex: B, grade: M40, subject: fly ash}
      - {annex: C, grade: M40, subject: GGBS}
      - {annex: D, grade: M70, subject: high strength, Section 3}
      - {annex: E, grade: M30, subject: self-compacting concrete}
      - {annex: F, grade: M15, subject: mass concrete}
    notes:
      - >-
        All six become unit tests. Passing them verifies the deterministic layer against the
        standard rather than against our reading of it.
      - >-
        The previous engine's coverage was 13 assertions drawn from Annexes A, D and F only;
        B, C and E were never tested, and the D assertions covered only the water step, not
        the w/cm step — which is precisely why §8.1 went unnoticed.
      - >-
        The expected values live with the tests, not in this registry. A worked example is a
        fixture, not a rule.

