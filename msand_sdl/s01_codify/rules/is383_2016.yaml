standard: IS 383
year: 2016
title: Coarse and Fine Aggregate for Concrete — Specification
revision: Third Revision
source_file: standards/is383_2016.pdf
library_file: IS_codes/IS-383-2016.pdf
source_sha256: null       # written by scripts/00_freeze_standards.py
read_from_primary: false  # docs/Build_Manual_v3.md §0.2 — source held, clauses not read

caveats:
  - id: not_read
    tag: NV
    manual_ref: "§0.2 and §9 item 3"
    text: >-
      The PDF is in the library and can be frozen, but no clause of it has been read from
      the primary text. Sand grading zones and coarse aggregate grading are cited by the
      previous engine ("IS 383 Table 9" for sand zones, "Table 7" for CA grading) and were
      never verified. Every rule sourced here stays UNVERIFIED until the clauses are read —
      a frozen source proves the bytes, not the reading.

  - id: revision_resolved
    tag: V
    manual_ref: "§0.3"
    text: >-
      RESOLVED. The title page and Foreword of the frozen copy both read "Third Revision"
      (IS 383 : 2016, January 2016, first published 1952, revised 1963 and 1970). poa.md was
      right; IS 10262:2019's reference list, which prints it as "(second revision)", is
      wrong. This closes the edition question only — it settles which document to read, not
      what it says. The zone and grading tables remain unread (§9 item 3, still open).

  - id: no_text_layer
    tag: V
    manual_ref: "§9 item 13"
    text: >-
      This source is a scanned image with no text layer. pdftotext yields 22 characters,
      all form feeds — 22 page breaks and not one character of content. Every value must be
      read from page images, and no script can ever verify a value against this file. Any
      rule promoted out of this file is attested by a reading, not by an extraction. The
      frozen hash proves the bytes are the ones that were read; it cannot prove the reading.

rules: []   # populated once the clauses are read from standards/is383_2016.pdf

